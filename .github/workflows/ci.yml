name: CI

on:
  push:
    branches: [main, feat/global-directory-rounds-16-29]
  pull_request:
    branches: [main, feat/api-hardening-bounded-body]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
